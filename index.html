<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#31445f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Lerninsel</title>
<style>
*{box-sizing:border-box}
:root{
 --bg:#f5f6f8;--card:#fff;--ink:#202632;--muted:#6b7481;--line:#dde3ea;
 --accent:#31445f;--accent2:#58769e;--soft:#eef2f7;--good:#e5f5e9;
 --warn:#fff3d8;--bad:#fde9e9;--purple:#7257a4;--sea:#eaf6f7
}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.hidden{display:none!important}
.app{max-width:1080px;margin:auto;padding:14px 14px 88px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}.brandIcon{width:44px;height:44px;border-radius:14px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:1.35rem}
.brand h1{font-size:1.32rem;margin:0}.brand p{margin:2px 0 0;color:var(--muted);font-size:.82rem}
.topActions{display:flex;gap:8px;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 4px 16px rgba(0,0,0,.035)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.primary,.ghost,.choice,.chip,.tab{border:0;border-radius:12px;padding:11px 14px}
.primary{background:var(--accent);color:#fff}.primary:disabled{opacity:.55}
.ghost,.choice,.chip,.tab{background:#fff;border:1px solid #d3dae3;color:#293347}
.big{width:100%;padding:15px;font-size:1.05rem;font-weight:800}
.sectionTitle{text-transform:uppercase;letter-spacing:.08em;font-size:.74rem;font-weight:800;color:var(--purple)}
.small{font-size:.84rem;color:var(--muted)}.muted{color:var(--muted)}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--soft);font-size:.75rem;font-weight:750}
.badge.good{background:var(--good)}.badge.warn{background:var(--warn)}.badge.bad{background:var(--bad)}
.subjectCard,.topicCard{min-height:135px}.subjectCard h3,.topicCard h3{margin:.45rem 0}.subjectCard p,.topicCard p{color:var(--muted);margin:.35rem 0}
.subjectIcon{font-size:1.55rem}.subjectHead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.back{margin-bottom:10px}
.profileBar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.profileLeft{display:flex;align-items:center;gap:10px}.avatar{width:48px;height:48px;border-radius:50%;background:#eef2f7;display:grid;place-items:center;font-size:1.65rem}
.points{font-weight:800}.token{background:#fff3d8;border-radius:999px;padding:6px 10px;font-size:.82rem;font-weight:800}
.topicSections{display:grid;gap:14px}.topicSection h3{margin:0 0 7px}.topicSection .hint{margin:0 0 10px;color:var(--muted);font-size:.86rem}
.lessonList,.homeworkList{display:grid;gap:9px}.itemRow{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
.itemRow h4{margin:0 0 3px}.itemRow p{margin:0;color:var(--muted);font-size:.84rem}
.itemRow .primary{flex:0 0 auto}
dialog{border:0;border-radius:20px;max-width:760px;width:calc(100% - 20px);padding:0;box-shadow:0 20px 70px rgba(0,0,0,.28)}
dialog::backdrop{background:rgba(20,24,30,.5)}.inside{padding:18px}
.lessonSection{background:#faf8ef;border-radius:14px;padding:14px;margin:10px 0;line-height:1.55}.lessonSection h3{margin:0 0 6px;font-size:1rem}
.merksatz{background:#edf4ff;border-left:4px solid #4f78a6;border-radius:10px;padding:12px;margin:12px 0;font-weight:700}
.videoCard{background:#f1f5fb;border:1px solid #d7e0ed;border-radius:14px;padding:14px;margin:12px 0}
.question{font-size:1.08rem;font-weight:800;margin:12px 0}
.choice{display:block;width:100%;text-align:left;margin:8px 0}.choice.selected{outline:3px solid #9eb1c8;background:#f3f7fb}.choice.correct{background:var(--good);border-color:#91c59d}.choice.wrong{background:var(--bad);border-color:#d99c9c}
.feedback{padding:10px 12px;border-radius:12px;margin-top:10px}.feedback.ok{background:var(--good)}.feedback.no{background:var(--bad)}
.sessionHead{display:flex;justify-content:space-between;gap:8px;background:#eef4fb;border-radius:12px;padding:9px 11px;margin-bottom:12px;font-size:.84rem;font-weight:800}
.flashcard{min-height:210px;display:flex;flex-direction:column;justify-content:center;text-align:center;background:linear-gradient(180deg,#fff,#f7f9fb);border:1px solid var(--line);border-radius:18px;padding:24px;margin:14px 0}
.flashcard .front{font-size:1.25rem;font-weight:850}.flashcard .backText{font-size:1.05rem;line-height:1.5}
.actions{display:flex;gap:8px;flex-wrap:wrap}.actions>*{flex:1;min-width:125px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.chip.used{opacity:.4}.builderOut{min-height:50px;background:#f5f7fa;border:1px dashed #b7c0cd;border-radius:12px;padding:12px}
.inlineSelect{width:auto;min-width:145px;margin:0 5px;padding:8px;border:1px solid #cfd6df;border-radius:10px}
.homeworkIntro{background:#f7f8fa;border-radius:14px;padding:13px;margin:10px 0}.stepBox{border:1px solid #e1e5eb;border-radius:14px;padding:13px;margin:10px 0}.stepBox h3{font-size:1rem;margin:0 0 8px}
.finalBox{background:#f4f7fb;border:1px dashed #b8c3d2;border-radius:14px;padding:14px;margin-top:12px;white-space:pre-wrap}
.quizTimer{font-size:1.2rem;font-weight:900}.scoreBig{font-size:2rem;font-weight:900}
.quizOption{font-size:1rem;min-height:54px}.rankList{display:grid;gap:8px}.rankRow{display:flex;justify-content:space-between;gap:10px;background:#f6f8fa;border-radius:12px;padding:10px}
.authCard{max-width:560px;margin:28px auto}.authCard h2{margin:.35rem 0}
label{display:block;font-weight:700;margin:11px 0 5px}input,select,textarea{width:100%;padding:11px;border:1px solid #cfd6df;border-radius:11px;background:#fff}
.setupGrid button{text-align:left}
.tabs{display:flex;gap:7px;overflow:auto;margin:10px 0 14px}.tab{white-space:nowrap}.tab.active{background:var(--accent);color:#fff}
.studentTable{display:grid;gap:8px}.studentRow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;border:1px solid var(--line);border-radius:13px;background:#fff}
.kpiGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.kpi{text-align:center;background:#f7f9fb;border-radius:14px;padding:12px}.kpi strong{display:block;font-size:1.25rem}
.gameArea{position:relative;height:360px;background:linear-gradient(#dff4ff 0 48%,#f8e8b7 48%);border-radius:18px;overflow:hidden;border:1px solid var(--line);margin:12px 0}
.shell{position:absolute;font-size:2.2rem;border:0;background:transparent;padding:0;animation:pop .16s ease-out}@keyframes pop{from{transform:scale(.5)}to{transform:scale(1)}}
.gameHud{display:flex;justify-content:space-between;gap:10px;font-weight:850}
.avatarGrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.avatarChoice{font-size:1.8rem;padding:10px;border:1px solid var(--line);background:#fff;border-radius:13px}.avatarChoice.selected{outline:3px solid #9eb1c8}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:9999;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;box-shadow:0 8px 28px rgba(0,0,0,.16);font-weight:800;max-width:calc(100% - 28px);text-align:center}
.liveCode{font-size:2rem;font-weight:900;letter-spacing:.1em;text-align:center;background:#eef4fb;border-radius:16px;padding:14px}
.footerReset{margin-top:30px;text-align:center}.footerReset button{font-size:.78rem;color:#7a8490;background:transparent;border:0}
@media(max-width:650px){
 .top{align-items:flex-start}.brand p{display:none}.itemRow{align-items:flex-start;flex-direction:column}.itemRow .primary{width:100%}
 .avatarGrid{grid-template-columns:repeat(4,1fr)}.profileBar{align-items:flex-start}.topActions{flex-direction:column}
}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand"><div class="brandIcon">🏝️</div><div><h1>Lerninsel</h1><p>Lernen · Üben · Hausaufgaben · Quiz</p></div></div>
  <div class="topActions">
    <button id="gameTopBtn" class="ghost hidden">🎮 Spiel</button>
    <button id="teacherLogoutBtn" class="ghost hidden">Abmelden</button>
  </div>
</header>

<main id="appMain"></main>

<div class="footerReset"><button id="resetDeviceBtn">Gerät neu einrichten</button></div>
</div>

<dialog id="workDialog"><div id="workInside" class="inside"></div></dialog>
<dialog id="profileDialog"><div id="profileInside" class="inside"></div></dialog>
<dialog id="gameDialog"><div id="gameInside" class="inside"></div></dialog>
<dialog id="liveDialog"><div id="liveInside" class="inside"></div></dialog>

<script src="config.js"></script>
<script src="app.js"></script>
<script>
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
</body>
</html>
